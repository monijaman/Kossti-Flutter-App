name: kossti
description: A multilingual product review platform for kossti.com
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP client
  http: ^1.2.1

  # Localizations
  intl: any

  # Local storage
  shared_preferences: ^2.2.3

  # Image loading
  cached_network_image: ^3.3.1

  # Navigation
  go_router: ^13.2.5

  # UI components
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  flutter_html: ^3.0.0-beta.2

  # Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/icons/

  # Uncomment and add Cairo font files to assets/fonts/ for Bengali support
  # Download from: https://fonts.google.com/specimen/Cairo
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
